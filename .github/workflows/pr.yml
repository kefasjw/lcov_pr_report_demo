name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v3

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
    
    - run: echo ${{ steps.changed-files.outputs.all_changed_files }}